<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bank - LapMob Budget Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-account-page="bank">

  <div class="container">

    <!-- =========================
         HEADER
         ========================= -->
    <div class="top">

      <div class="bank-page-title">
    <img
        src="assets/bbanner.png"
        alt="Bank">

</div>

      <div class="account-area">

        <button
  class="secondary"
  id="backBtn"
  type="button"
  onclick="window.location.href='./index.html';"
>
  ← Back to Dashboard
</button>

      </div>

    </div>


    <!-- =========================
         CURRENT BALANCE
         ========================= -->
    <div class="account-summary-card bank-balance-card">

    <div class="bank-balance-info">
        <span class="label">Current Balance</span>

        <div class="amount-with-eye">
            <strong id="pageBalance">NT$0</strong>

            <button
                type="button"
                class="eye-toggle"
                id="balanceEye"
                aria-label="Show or hide balance">
                👁
            </button>
        </div>
    </div>

    <img
        src="assets/b1.png"
        alt="Bank illustration"
        class="bank-balance-image">

</div>


    <!-- =========================
         MAIN ACCOUNT AREA
         LEFT = ADD TRANSACTION
         RIGHT = SUMMARY + TRANSACTIONS
         ========================= -->
    <div class="account-page-layout">


      <!-- =========================
           LEFT SIDE
           ADD TRANSACTION
           ========================= -->
      <div class="panel account-add-panel">

        <h2>
          Add Transaction
        </h2>


        <form id="accountTransactionForm">


          <!-- ACCOUNT -->
          <label for="account">
            Account
          </label>

          <select
            id="account"
            disabled
          >

            <option value="bank">
              Bank
            </option>

          </select>


          <!-- TYPE -->
          <label for="type">
            Type
          </label>

          <select id="type">

            <option value="income">
              Income
            </option>

            <option value="expense">
              Expense
            </option>

            <option value="withdrawal">
              Withdrawal
            </option>

          </select>


          <!-- CATEGORY -->
          <label for="category">
            Category
          </label>

          <select id="category">

            <option>
              Allowance
            </option>

            <option>
              Salary
            </option>

            <option>
              Deposit
            </option>

            <option>
              Cash Withdrawal
            </option>

            <option>
              Rent
            </option>

            <option>
              Food
            </option>

            <option>
              Electricity
            </option>

            <option>
              Public Electricity
            </option>

            <option>
              Tuition
            </option>

            <option>
              Transportation
            </option>

            <option>
              Gasoline
            </option>

            <option>
              Phone / Internet
            </option>

            <option>
              Motorcycle
            </option>

            <option>
              Shopping
            </option>

            <option>
              Entertainment
            </option>

            <option>
              School
            </option>

            <option>
              Other
            </option>

          </select>


          <!-- AMOUNT -->
          <label for="amount">
            Amount (NT$)
          </label>

          <input
            id="amount"
            type="number"
            min="0"
            step="1"
            required
            autocomplete="off"
            inputmode="numeric"
            placeholder="Enter amount"
          >


          <!-- DATE -->
          <label for="date">
            Date
          </label>

          <input
            id="date"
            type="date"
            required
          >


          <!-- NOTE -->
          <label for="note">
            Note
          </label>

          <input
            id="note"
            maxlength="80"
            placeholder="Optional"
          >


          <button type="submit">
  ＋ Add Transaction
</button>

</form>

<!-- BOY + PIGGY BANK -->
<div class="bank-transaction-character">
  <img src="assets/b2.png"
       alt="Budget assistant">
</div>

</div>


      <!-- =========================
           RIGHT SIDE
           ========================= -->
      <div class="account-right-column">


        <!-- =========================
             INCOME / EXPENSES / WITHDRAWALS
             ========================= -->
        <div class="account-stats">


          <!-- INCOME -->
          <div class="mini">

            <span class="label">
              Income
            </span>

            <div class="amount-with-eye">

              <b
                id="pageIncome"
                class="income"
              >
                NT$0
              </b>

              <button
                class="eye-toggle"
                type="button"
                data-target="pageIncome"
                aria-label="Hide income"
                title="Hide income"
              >
                👁
              </button>

            </div>

          </div>


          <!-- EXPENSES -->
          <div class="mini">

            <span class="label">
              Expenses
            </span>

            <div class="amount-with-eye">

              <b
                id="pageExpense"
                class="expense"
              >
                NT$0
              </b>

              <button
                class="eye-toggle"
                type="button"
                data-target="pageExpense"
                aria-label="Hide expenses"
                title="Hide expenses"
              >
                👁
              </button>

            </div>

          </div>


          <!-- WITHDRAWALS -->
          <div class="mini">

            <span class="label">
              Withdrawals
            </span>

            <div class="amount-with-eye">

              <b
                id="pageWithdrawal"
                class="withdrawal"
              >
                NT$0
              </b>

              <button
                class="eye-toggle"
                type="button"
                data-target="pageWithdrawal"
                aria-label="Hide withdrawals"
                title="Hide withdrawals"
              >
                👁
              </button>

            </div>

          </div>

        </div>


        <!-- =========================
             BANK TRANSACTIONS
             ========================= -->
        <div class="panel account-transactions-panel">

          <h2>
            Bank Transactions
          </h2>


          <!-- INCOME -->
          <section class="transaction-group">

            <div class="transaction-group-title income-title">

              <h3>
                Income
              </h3>

              <span id="pageIncomeTotal">
                NT$0
              </span>

            </div>


            <div class="transaction-list">

              <div class="transaction-list-head">

                <span>
                  Date
                </span>

                <span>
                  Category
                </span>

                <span>
                  Note
                </span>

                <span>
                  Amount
                </span>

                <span></span>

              </div>


              <div
                id="incomeRows"
                class="transaction-list-body"
              >
              </div>

            </div>

          </section>


          <!-- EXPENSES -->
          <section class="transaction-group">

            <div class="transaction-group-title expense-title">

              <h3>
                Expenses
              </h3>

              <span id="pageExpenseTotal">
                NT$0
              </span>

            </div>


            <div class="transaction-list">

              <div class="transaction-list-head">

                <span>
                  Date
                </span>

                <span>
                  Category
                </span>

                <span>
                  Note
                </span>

                <span>
                  Amount
                </span>

                <span></span>

              </div>


              <div
                id="expenseRows"
                class="transaction-list-body"
              >
              </div>

            </div>

          </section>


          <!-- WITHDRAWALS -->
          <section class="transaction-group">

            <div class="transaction-group-title withdrawal-title">

              <h3>
                Withdrawals
              </h3>

              <span id="pageWithdrawalTotal">
                NT$0
              </span>

            </div>


            <div class="transaction-list">

              <div class="transaction-list-head">

                <span>
                  Date
                </span>

                <span>
                  Category
                </span>

                <span>
                  Note
                </span>

                <span>
                  Amount
                </span>

                <span></span>

              </div>


              <div
                id="withdrawalRows"
                class="transaction-list-body"
              >
              </div>

            </div>

          </section>

        </div>

      </div>

    </div>

  </div>


  <!-- ACCOUNT JAVASCRIPT -->
  <script type="module" src="account-page.js"></script>

</body>

</html>
